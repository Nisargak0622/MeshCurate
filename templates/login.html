{% extends "base.html" %}
{% block title %}Login - MeshCurate{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>Welcome back</h2>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p class="auth-switch">No account yet? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
